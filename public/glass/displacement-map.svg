<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" preserveAspectRatio="none">
  <!--
    Displacement map for the Liquid Glass filter.

    feDisplacementMap reads the red channel as the horizontal offset and the
    green channel as the vertical one, with 128 meaning "no shift". So each
    gradient sits at exactly 128 through the middle of the surface and only
    diverges over the last few percent of each edge, which bends the backdrop
    at the rim and leaves the centre untouched. A plain full-width ramp would
    scale the whole backdrop instead of refracting its edge.

    The bezel is expressed as a fraction of the surface, so it stretches with
    the element: the horizontal bezel stays proportional on a wide bar, and the
    vertical bezel stays constant on the fixed 44px-tall navbar.
  -->
  <defs>
    <linearGradient id="dx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" />
      <stop offset="0.035" stop-color="#800000" />
      <stop offset="0.965" stop-color="#800000" />
      <stop offset="1" stop-color="#ff0000" />
    </linearGradient>
    <linearGradient id="dy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" />
      <stop offset="0.22" stop-color="#008000" />
      <stop offset="0.78" stop-color="#008000" />
      <stop offset="1" stop-color="#00ff00" />
    </linearGradient>
  </defs>

  <rect width="800" height="44" fill="#000000" />
  <rect width="800" height="44" fill="url(#dx)" style="mix-blend-mode:screen" />
  <rect width="800" height="44" fill="url(#dy)" style="mix-blend-mode:screen" />
</svg>
